name: secrets-scan

# Server-side backstop for the secrets-scan defense: catches leaks if a local hook was bypassed or absent.
# Runs only the exact doxguard 0.2.0 package (strict) through scripts/secrets-scan.dual.mjs --native-only.
#
# Note: the CI runner does NOT have access to any private watchlist, so only the structural
# patterns (Windows/POSIX absolute paths, RFC1918 private IPs, emails) run on this side.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: scan tracked files
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve exact public scanner package
        continue-on-error: true
        run: |
          if ! npm install --prefix "$RUNNER_TEMP/doxguard-ci" --ignore-scripts --include=optional --package-lock=false --no-save doxguard@0.2.0 > "$RUNNER_TEMP/doxguard-install.log" 2>&1; then
            echo 'Exact doxguard 0.2.0 package unavailable; dual gate will fail closed.'
            exit 1
          fi

      - name: Test strict native positive and negative controls
        if: ${{ !cancelled() }}
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DOXGUARD_PACKAGE_ROOT: ${{ runner.temp }}/doxguard-ci/node_modules/doxguard
        run: node scripts/secrets-scan.dual.mjs --native-only --controls

      - name: Test safe scanner reporting
        if: ${{ !cancelled() }}
        run: node --test scripts/secrets-scan.dual.test.mjs scripts/secrets-scan.staged.test.mjs

      - name: Run strict public scan (doxguard only)
        if: ${{ !cancelled() }}
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DOXGUARD_PACKAGE_ROOT: ${{ runner.temp }}/doxguard-ci/node_modules/doxguard
        run: node scripts/secrets-scan.dual.mjs --native-only --all-tracked
